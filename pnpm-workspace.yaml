packages:
  - .

allowBuilds:
  esbuild: false
  protobufjs: false
  unrs-resolver: false

blockExoticSubdeps: true

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - pnpm@11.19.0
  - brace-expansion@5.0.8

  - '@modelcontextprotocol/codemod@2.0.0'
  - '@modelcontextprotocol/client@2.0.0'
  - '@modelcontextprotocol/core@2.0.0'
  - protobufjs@8.0.2 || 8.2.0 || 8.4.1 || 8.5.1 || 8.6.6
  - '@opentelemetry/core@2.8.0'
  - '@hono/node-server@2.0.5'
  - '@opentelemetry/propagator-jaeger@2.9.0'

overrides:
  '@hono/node-server@<2.0.5': ^2.0.5
  '@opentelemetry/core@<2.8.0': ^2.8.0
  '@opentelemetry/propagator-jaeger@<2.9.0': ^2.9.0
  brace-expansion@<=5.0.7: ^5.0.8
  chokidar: '>=5'
  eslint-import-resolver-typescript: '^4.4.5'
  protobufjs@>=8.0.0 <8.2.0: ^8.2.0
  protobufjs@>=8.0.0 <=8.0.1: ^8.0.2
  protobufjs@>=8.0.0 <=8.4.0: ^8.4.1
  protobufjs@>=8.0.0 <=8.5.0: ^8.5.1
  protobufjs@>=8.0.0 <=8.6.5: ^8.6.6
  semver: '>=7'
  uuid@<11.1.1: ^14

trustPolicy: no-downgrade
